          schema:
            type: boolean
            default: false
        - name: hasSteam
          in: query
          schema:
            type: boolean
            default: false
        - name: discordId
          in: query
          schema:
            type: string
            pattern: ^[0-9]{1,32}$
        - name: steamId
          in: query
          schema:
            type: string
            pattern: ^[0-9]{1,32}$
