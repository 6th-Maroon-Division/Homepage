components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: NextAuth.js session token (cookie-based)
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: BotToken
      description: Active bot token stored in the BotToken database table. Use Authorization Bearer; environment tokens and
        X-BOT-API-TOKEN are not accepted.
    sessionCookie:
      type: apiKey
      in: cookie
      name: next-auth.session-token
      description: Development HTTP session cookie. User permissions and hierarchy are evaluated from the database.
    secureSessionCookie:
      type: apiKey
      in: cookie
      name: __Secure-next-auth.session-token
      description: Production HTTPS session cookie. Alternative to the development cookie and bot bearer token.
