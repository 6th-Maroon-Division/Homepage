openapi: 3.1.0
info:
  title: 6MD Management Platform API
  description: |
    Web application API for managing Arma 3 unit operations, signups, attendance, ranks, 
    training progression, and admin workflows for the 6th Maroon Division.
  version: 1.0.0
  contact:
    name: 6th Maroon Division
  license:
    name: Proprietary
    identifier: 6MD
servers:
  - url: http://localhost:3000/api
    description: Development server
  - url: https://orbat.6md.net/api
    description: Production server
tags:
  - name: Authentication
    description: Discord OAuth and Steam OpenID authentication
  - name: Users
    description: User management and profiles
  - name: ORBATs
    description: Operations and organizational structure management
  - name: Signups
    description: Operation signup management
  - name: Attendance
    description: Operation attendance tracking
  - name: Training
    description: Training management and progression
  - name: Ranks
    description: Rank system and promotions
  - name: Messaging
    description: System messaging and notifications
  - name: Radio Frequencies
    description: Radio frequency management
  - name: Templates
    description: ORBAT template management
  - name: Admin
    description: Administrative functions
  - name: Realtime
    description: Server-Sent Events (SSE) streams
  - name: Leave of Absence
    description: LOA management
  - name: Bot
    description: Discord bot integration endpoints
security:
  - bearerAuth: []
paths:
  /admin/catalog/events:
    get:
      tags:
        - Admin
        - Realtime
      summary: Admin catalog SSE stream
      security:
        - bearerAuth:
            - orbat:view_all
            - templates:view
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: object
  /admin/import/legacy-user-data:
    get:
      tags:
        - Admin
        - Import
      summary: Get legacy user data
      security:
        - bearerAuth:
            - user:import
      responses:
        "200":
          description: Legacy user data
    post:
      tags:
        - TODO
      summary: TODO document POST /admin/import/legacy-user-data
      responses:
        "200":
          description: Success
  /admin/import/legacy-user-data/apply:
    post:
      tags:
        - Admin
        - Import
      summary: Apply legacy user data import
      security:
        - bearerAuth:
            - user:import
      responses:
        "200":
          description: Import applied
  /admin/import/legacy-user-data/map:
    post:
      tags:
        - Admin
        - Import
      summary: Map legacy user data
      security:
        - bearerAuth:
            - user:import
      responses:
        "200":
          description: Mappings saved
  /admin/users/events:
    get:
      tags:
        - Admin
        - Users
        - Realtime
      summary: Admin users list SSE stream
      security:
        - bearerAuth:
            - user:manage
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: object
  /attendance:
    get:
      tags:
        - Attendance
      summary: Get all attendance records
      security:
        - bearerAuth:
            - attendance:view_all
      responses:
        "200":
          description: All attendance records
  /attendance/{attendanceId}:
    get:
      tags:
        - Attendance
      summary: Read attendance record
      description: Requires global attendance:view and target hierarchy (self allowed after global permission). Minimal
        display users and log actors only; other-user reads, including actor display names, are audited.
        Unknown/repeated query arguments rejected. All returned timestamps UTC ISO. Active bot tokens share the same
        endpoint; explicit invalid Authorization never falls back.
      security:
        - sessionCookie: []
        - secureSessionCookie: []
        - apiKey: []
      parameters:
        - name: attendanceId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data:
                    $ref: "#/components/schemas/AttendanceRecord"
                  meta:
                    type: object
                required:
                  - data
                  - meta
        "400":
          description: Invalid path query or JSON
        "401":
          description: Missing or invalid credentials
        "403":
          description: Permission or hierarchy denied
        "404":
          description: Resource or reference missing
        "409":
          description: Duplicate attendance side-operation or concurrency conflict
        "422":
          description: Invalid payload or timing
        "500":
          description: Internal failure; writes rolled back and read audits fail closed
    patch:
      tags:
        - Attendance
      summary: Update attendance record
      description: Requires global attendance:edit and live hierarchy against previous and new users. Side operations reject
        edits. Serializable transaction updates record, owner-linked sessions, note flags, manual attendance log and
        redacted audit. Status and notes retain omitted values. Unknown/repeated query arguments rejected. All returned
        timestamps UTC ISO. Active bot tokens share the same endpoint; explicit invalid Authorization never falls back.
      security:
        - sessionCookie: []
        - secureSessionCookie: []
        - apiKey: []
      parameters:
        - name: attendanceId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data:
                    $ref: "#/components/schemas/AttendanceRecord"
                  meta:
                    type: object
                required:
                  - data
                  - meta
        "400":
          description: Invalid path query or JSON
        "401":
          description: Missing or invalid credentials
        "403":
          description: Permission or hierarchy denied
        "404":
          description: Resource or reference missing
        "409":
          description: Duplicate attendance side-operation or concurrency conflict
        "422":
          description: Invalid payload or timing
        "500":
          description: Internal failure; writes rolled back and read audits fail closed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendancePatch"
    delete:
      tags:
        - Attendance
      summary: Delete attendance record
      description: Requires global attendance:edit and target hierarchy. Deletes attendance with cascading sessions/logs;
        durable audit preserves affected record IDs and user IDs without private note text. Side-operation stale
        attendance can be deleted. Unknown/repeated query arguments rejected. All returned timestamps UTC ISO. Active
        bot tokens share the same endpoint; explicit invalid Authorization never falls back.
      security:
        - sessionCookie: []
        - secureSessionCookie: []
        - apiKey: []
      parameters:
        - name: attendanceId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data:
                    type: "null"
                  meta:
                    type: object
                required:
                  - data
                  - meta
        "400":
          description: Invalid path query or JSON
        "401":
          description: Missing or invalid credentials
        "403":
          description: Permission or hierarchy denied
        "404":
          description: Resource or reference missing
        "409":
          description: Duplicate attendance side-operation or concurrency conflict
        "422":
          description: Invalid payload or timing
        "500":
          description: Internal failure; writes rolled back and read audits fail closed
  /attendance/automated:
    post:
      tags:
        - Attendance
      summary: Process automated attendance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "201":
          description: Automated attendance processed
  /attendance/import:
    post:
      tags:
        - Attendance
      summary: Import attendance data
      security:
        - bearerAuth:
            - attendance:import
      responses:
        "201":
          description: Attendance imported
  /attendance/legacy-data:
    get:
      tags:
        - TODO
      summary: TODO document GET /attendance/legacy-data
      responses:
        "200":
          description: Success
    put:
      tags:
        - TODO
      summary: TODO document PUT /attendance/legacy-data
      responses:
        "200":
          description: Success
  /attendance/legacy-import:
    post:
      tags:
        - TODO
      summary: TODO document POST /attendance/legacy-import
      responses:
        "200":
          description: Success
  /attendance/legacy-import/user-data:
    post:
      tags:
        - TODO
      summary: TODO document POST /attendance/legacy-import/user-data
      responses:
        "200":
          description: Success
    get:
      tags:
        - TODO
      summary: TODO document GET /attendance/legacy-import/user-data
      responses:
        "200":
          description: Success
  /attendance/legacy-import/user-data/map:
    put:
      tags:
        - TODO
      summary: TODO document PUT /attendance/legacy-import/user-data/map
      responses:
        "200":
          description: Success
  /auth/{...nextauth}:
    get:
      tags:
        - Authentication
      summary: NextAuth.js authentication handler
      responses:
        "302":
          description: Redirect to authentication provider
        "401":
          description: Unauthorized
      security: []
    parameters:
      - name: ...nextauth
        in: path
        required: true
        schema:
          type: string
        description: Framework-managed authentication action path.
    post:
      tags:
        - Authentication
      summary: NextAuth.js authentication action
      description: Framework-owned CSRF, session, and provider flow; exempt from the business API envelope.
      security: []
      responses:
        "200":
          description: Framework authentication response
        "302":
          description: Authentication redirect
        "400":
          description: Invalid authentication request
        "401":
          description: Authentication failed
  /auth/steam-callback:
    get:
      tags:
        - Authentication
      summary: Steam OpenID callback handler
      responses:
        "302":
          description: Redirect after successful authentication
        "401":
          description: Authentication failed
  /auth/steam-login:
    get:
      tags:
        - Authentication
      summary: Initiate Steam OpenID login
      responses:
        "302":
          description: Redirect to Steam login
  /auth/steam-signin:
    get:
      tags:
        - Authentication
      summary: Link Steam account to existing user
      responses:
        "302":
          description: Redirect to Steam login or back to profile
  /bot/attendance:
    post:
      tags:
        - TODO
      summary: TODO document POST /bot/attendance
      responses:
        "200":
          description: Success
  /bot/attendance/backfill:
    post:
      tags:
        - TODO
      summary: TODO document POST /bot/attendance/backfill
      responses:
        "200":
          description: Success
  /bot/attendance/compile:
    post:
      tags:
        - Bot
        - Attendance
      summary: Compile attendance for an ORBAT
      description: |
        Compiles raw attendance events into structured attendance records for a specific ORBAT.
        The bot should call this when it detects an ORBAT has ended (by checking endTime and server empty).
        This matches events to the ORBAT timeframe, calculates durations, and creates/updates attendance records.
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - orbatId
              properties:
                orbatId:
                  type: integer
                  description: ID of the ORBAT to compile attendance for
                  example: 123
      responses:
        "200":
          description: Attendance compiled successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  orbatId:
                    type: integer
                    description: ID of the compiled ORBAT
                    example: 123
                  orbatName:
                    type: string
                    description: Name of the ORBAT
                    example: Operation Thunder Strike
                  eventDate:
                    type: string
                    format: date
                    description: Date of the ORBAT
                    example: 2024-01-15
                  compiledCount:
                    type: integer
                    description: Number of attendance records compiled
                    example: 42
                  totalEventsProcessed:
                    type: integer
                    description: Total number of raw events processed
                    example: 105
                  attendance:
                    type: array
                    description: Compiled attendance for each user
                    items:
                      type: object
                      properties:
                        userId:
                          type: integer
                          example: 42
                        username:
                          type: string
                          example: Soldier_John
                        status:
                          type: string
                          enum:
                            - present
                            - absent
                            - partial
                            - late
                            - gone_early
                            - no_show
                          example: present
                        totalMinutesPresent:
                          type: integer
                          example: 180
                        joinCount:
                          type: integer
                          description: Number of join events for this user
                          example: 1
                        leaveCount:
                          type: integer
                          description: Number of leave events for this user
                          example: 1
        "400":
          description: Invalid request data (missing orbatId, ORBAT missing time info)
        "401":
          description: Unauthorized - invalid or missing bot API token
        "404":
          description: ORBAT not found
        "500":
          description: Internal server error
  /bot/events:
    post:
      tags:
        - Bot
      summary: Record raw attendance event
      description: |
        Records a raw check-in or check-out event from the Discord bot.
        Events are ORBAT-agnostic and can be matched to operations later.
        Requires either steamId or discordUserId to identify the user.
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - isJoin
                - timestamp
              properties:
                steamId:
                  type: string
                  description: Steam64 ID of the user
                  example: "76561198000000000"
                discordUserId:
                  type: string
                  description: Discord user ID
                  example: "123456789012345678"
                isJoin:
                  type: boolean
                  description: true for check-in/join, false for check-out/leave
                  example: true
                timestamp:
                  type: string
                  format: date-time
                  description: ISO 8601 timestamp when the event occurred
                  example: 2024-01-15T12:30:00Z
      responses:
        "201":
          description: Event recorded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  eventId:
                    type: integer
                    description: ID of the created event
                    example: 123
                  userId:
                    type: integer
                    description: Database user ID
                    example: 42
                  username:
                    type: string
                    description: Username of the user
                    example: Soldier_John
                  isJoin:
                    type: boolean
                    example: true
                  eventTime:
                    type: string
                    format: date-time
                    example: 2024-01-15T12:30:00.000Z
        "400":
          description: Invalid request data
        "401":
          description: Unauthorized - invalid or missing bot API token
        "404":
          description: User not found
        "500":
          description: Internal server error
  /bot/events/orbats:
    get:
      tags:
        - Bot
        - Realtime
      summary: Replay or stream durable ORBAT lifecycle events
      description: Returns JSON unless Accept is text/event-stream. Resume with Last-Event-ID or cursor.
      security:
        - apiKey: []
      responses:
        "200":
          description: Success
  /bot/events/ranks:
    get:
      tags:
        - Bot
        - Realtime
      summary: Replay or stream durable applied-rank events
      description: Returns JSON unless Accept is text/event-stream. Resume with Last-Event-ID or cursor.
      security:
        - apiKey: []
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
        - name: Last-Event-ID
          in: header
          schema:
            type: string
      responses:
        "200":
          description: Success
  /bot/events/training:
    get:
      tags:
        - Bot
        - Realtime
      summary: Replay or stream durable training lifecycle events
      description: Returns JSON unless Accept is text/event-stream. Resume with Last-Event-ID or cursor.
      security:
        - apiKey: []
      responses:
        "200":
          description: Success
  /bot/training-reminders:
    post:
      tags:
        - TODO
      summary: TODO document POST /bot/training-reminders
      responses:
        "200":
          description: Success
  /messaging/{id}/read:
    post:
      tags:
        - Messaging
      summary: Mark message as read
      responses:
        "200":
          description: Message marked as read
        "401":
          description: Unauthorized
    put:
      tags:
        - TODO
      summary: TODO document PUT /messaging/{id}/read
      responses:
        "200":
          description: Success
  /messaging/events:
    get:
      tags:
        - Messaging
        - Realtime
      summary: Inbox SSE stream
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: object
  /messaging/inbox:
    get:
      tags:
        - Messaging
      summary: Get user inbox
      responses:
        "200":
          description: User inbox
        "401":
          description: Unauthorized
  /messaging/read-all:
    post:
      tags:
        - Messaging
      summary: Mark all messages as read
      responses:
        "200":
          description: All messages marked as read
        "401":
          description: Unauthorized
    put:
      tags:
        - TODO
      summary: TODO document PUT /messaging/read-all
      responses:
        "200":
          description: Success
  /messaging/send:
    post:
      tags:
        - Messaging
      summary: Send message
      security:
        - bearerAuth:
            - system:super_admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                message:
                  type: string
                type:
                  type: string
                  enum:
                    - general
                    - orbat
                    - training
                    - rankup
                    - alert
                actionUrl:
                  type: string
                  format: uri
                audience:
                  type: string
                  enum:
                    - all
                    - admin
      responses:
        "201":
          description: Message sent
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
  /orbats:
    get:
      tags:
        - ORBATs
      summary: List public ORBATs
      description: Public minimal ORBAT directory for anonymous callers, live sessions and active bearer tokens. Invalid
        explicit credentials fail. Strict single limit/cursor/includePast/startAt/endBefore filters; descending ID pages
        with genuine lookahead. includePast defaults true; false uses current UTC midnight unless explicit startAt
        supplied. Zoned startAt is inclusive and endBefore exclusive; legacy date-only operations use UTC eventDate when
        startsAtUtc is absent. No user data read audit. Retrieve full public operation data through /orbats/{id}/full.
      security:
        - {}
        - sessionCookie: []
        - secureSessionCookie: []
        - apiKey: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            default: 50
          description: Values above 100 are clamped to 100.
        - name: cursor
          in: query
          schema:
            type: string
            pattern: ^[0-9]+$
          description: Positive Int32 ORBAT ID from meta.nextCursor; returns smaller IDs in descending order.
        - name: includePast
          in: query
          schema:
            type: boolean
            default: true
        - name: startAt
          in: query
          schema:
            type: string
            format: date-time
          description: Explicit timezone required.
        - name: endBefore
          in: query
          schema:
            type: string
            format: date-time
          description: Explicit timezone required.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PublicOrbatListItem"
                  meta:
                    type: object
                    required:
                      - limit
                      - nextCursor
                    properties:
                      limit:
                        type: integer
                        minimum: 1
                        maximum: 100
                      nextCursor:
                        type:
                          - string
                          - "null"
        "400":
          description: Invalid arguments or malformed JSON
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiFailure"
        "401":
          description: Invalid supplied Authorization credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiFailure"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiFailure"
    post:
      tags:
        - ORBATs
      summary: Create an ORBAT
      description: No query parameters are accepted (400 if supplied). Requires orbat:create for session users. Active
        database bot tokens act as superadmin. User sessions record their creator ID; active superadmin bot tokens
        create with a null creator, attributed through the audit actor. Deploy the optional-creator database migration
        first for bot creation. Missing role/frequency references return 404; retired roles or transaction/reference
        conflicts return 409. A serializable transaction creates operation/squads/slots/frequency links, the existing
        orbat.created outbox event, and a metadata-only audit without briefing text. Realtime notifications are emitted
        safely after commit. Returns only data.id; public GET behavior remains unchanged.
      security:
        - sessionCookie: []
        - secureSessionCookie: []
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrbatCreateInput"
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required:
                      - id
                    properties:
                      id:
                        type: integer
                        minimum: 1
                        maximum: 2147483647
                  meta:
                    type: object
                    additionalProperties: true
        "400":
          description: Invalid arguments or malformed JSON
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiFailure"
        "401":
          description: Missing or invalid authentication
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiFailure"
        "403":
          description: Insufficient permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiFailure"
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiFailure"
        "409":
          description: Conflicting resource state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiFailure"
        "422":
          description: Payload validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiFailure"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiFailure"
  /orbats/{id}:
    get:
      summary: Get ORBAT editor resource
      description: orbat:edit required. No query arguments. PATCH preserves omitted fields; squads replaces the full structure
        retaining supplied owned IDs. Past UTC dates allowed; end must follow merged start. Writes and metadata-only
        audits/outbox are atomic.
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data:
                    $ref: "#/components/schemas/OrbatEditor"
                  meta:
                    type: object
                required:
                  - data
                  - meta
        "400":
          description: Invalid path query or JSON
        "401":
          description: Missing or invalid credentials
        "403":
          description: Permission denied
        "404":
          description: Operation or reference not found
        "409":
          description: Concurrent change or constraint conflict
        "422":
          description: Invalid payload or timing
        "500":
          description: Internal failure
    patch:
      summary: Patch ORBAT editor resource
      description: orbat:edit required. No query arguments. PATCH preserves omitted fields; squads replaces the full structure
        retaining supplied owned IDs. Past UTC dates allowed; end must follow merged start. Writes and metadata-only
        audits/outbox are atomic.
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    properties:
                      id:
                        type: integer
                        minimum: 1
                        maximum: 2147483647
                    required:
                      - id
                  meta:
                    type: object
                required:
                  - data
                  - meta
        "400":
          description: Invalid path query or JSON
        "401":
          description: Missing or invalid credentials
        "403":
          description: Permission denied
        "404":
          description: Operation or reference not found
        "409":
          description: Concurrent change or constraint conflict
        "422":
          description: Invalid payload or timing
        "500":
          description: Internal failure
      requestBody:
        required: true
        content:
          application/json:
            schema:
