            type: string
            enum:
              - "true"
              - "false"
            default: "false"
          description: Optional strict boolean string; other values return 400.
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            default: 50
          description: Values above 100 are clamped to 100.
        - name: cursor
          in: query
          schema:
            type: string
            pattern: ^[0-9]+$
          description: Positive 32-bit user ID from meta.nextCursor; returns users with greater IDs in ascending order.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/TrainingUserLookup"
                  meta:
                    type: object
                    required:
                      - limit
                      - nextCursor
                    properties:
                      limit:
                        type: integer
                        minimum: 1
                        maximum: 100
                      nextCursor:
                        type:
                          - string
